# Sanitized sample modelled on hero's /etc/haproxy/haproxy.cfg.
# This file is test fixture only; comments like this one are dropped on import.
global
    log 127.0.0.1 local0 notice
    maxconn 2000
    user haproxy
    group haproxy

defaults
    mode http
    log global
    timeout connect 20000ms
    timeout server 1h
    timeout client 1h
    timeout tunnel 1h

# stats dashboard (kept as a raw section: no ssl bind)
frontend stats
    bind *:1936
    stats enable
    stats hide-version
    stats realm Haproxy\ Statistics
    stats uri /
    stats auth user:password
    log 127.0.0.1 local0 notice

frontend https_in
    bind *:443 ssl crt /etc/haproxy/certs/certmachine.cmdhome.net.pem crt /etc/haproxy/certs/brandx.cmdhome.net.pem crt /etc/haproxy/certs/s3-hero.cmdhome.net.pem
    mode http
    option httplog
    option http-server-close
    acl host_brandx hdr(host) -i brandx.cmdhome.net
    acl host_s3 hdr(host) -i s3-hero.cmdhome.net s3-hero.cmdhome.net:443
    use_backend brandx_backend if host_brandx
    use_backend s3_hero_backend if host_s3
    option forwardfor
    default_backend unified_webapp

backend brandx_backend
    server brandx hero.cmdhome.net:8181 check

backend s3_hero_backend
    server s3 127.0.0.1:6161 check

# legacy frontend kept commented out upstream; dropped on import
#frontend old_thing
#    bind *:9999
#    default_backend nope

frontend fakes3_ui_https
    bind *:8443 ssl crt /etc/haproxy/certs/s3-hero.cmdhome.net.pem
    mode http
    default_backend fakes3_ui_backend

backend fakes3_ui_backend
    server fakes3_ui 127.0.0.1:6767 check

backend unified_webapp
    server app 127.0.0.1:8787 check
