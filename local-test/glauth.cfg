# glauth test LDAP server for unified-webapp local testing.
# Run:  glauth -c local-test/glauth.cfg
# (install: https://github.com/glauth/glauth/releases — single static binary,
#  or: docker run -p 3893:3893 -v $PWD/local-test/glauth.cfg:/app/config/config.cfg glauth/glauth)
#
# Test accounts (passwords are sha256-hashed below):
#   chris       / ldap-test-1    — member of "household" (allowed to log in)
#   serviceuser / svc-secret-1   — read-only bind account used by the webapp
#
# Matches local-test/config.json's auth.ldap section:
#   url: ldap://127.0.0.1:3893
#   bind_dn: cn=serviceuser,dc=glauth,dc=com
#   base_dn: dc=glauth,dc=com
#   user_filter: (cn=%s)
#   required_groups: ["household"]

[ldap]
  enabled = true
  listen = "127.0.0.1:3893"

[ldaps]
  enabled = false

[backend]
  datastore = "config"
  baseDN = "dc=glauth,dc=com"

[behaviors]
  IgnoreCapabilities = false

[[users]]
  name = "chris"
  uidnumber = 5001
  primarygroup = 5501
  passsha256 = "cda9eedf5a40b90ffa301018fea385e9efdf1f4c795ddc078cc3620869ac3eaa"

[[users]]
  name = "serviceuser"
  uidnumber = 5003
  primarygroup = 5502
  passsha256 = "a14ec505f141f9b10886eb4dfa1eaeacc7c58005a71148f7c8eccab93f2be283"
  [[users.capabilities]]
    action = "search"
    object = "*"

[[groups]]
  name = "household"
  gidnumber = 5501

[[groups]]
  name = "svcaccts"
  gidnumber = 5502
