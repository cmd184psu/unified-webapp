<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compare Lists</title>
  <link rel="shortcut icon" href="images/fvw.png" type="image/x-icon">
  <link rel="stylesheet" href="/shared/dist/shared.css">
  <link rel="stylesheet" href="css/todo.css?v=20">
  <link rel="stylesheet" href="css/compare.css?v=1">

  <script src="js/jquery.js"></script>
  <script src="js/utils.js"></script>
  <!-- theme-bootstrap:start -->
  <script>(function(){var k=localStorage.getItem("todo-theme");
  var t=(k==="dark"||k==="light")?k:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.setAttribute("data-theme",t)})()</script>
  <!-- theme-bootstrap:end -->
  <script type="module" src="js/shell.js"></script>
  <script src="js/compare.js?v=1"></script>
  <script>
    $(document).ready(function () {
      const urlParams = new URLSearchParams(window.location.search);
      const params = {};
      for (const [k, v] of urlParams.entries()) { params[k] = v; }
      startCompare(params);
    });
  </script>
</head>

<body>

  <!-- ── Top Navigation Bar ─────────────────────────────────────────────── -->
  <nav class="topbar">
    <div class="topbar-left">
      <a class="icon-btn" href="index.html" title="Back to list">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
      </a>
      <span class="topbar-brand">Compare Lists</span>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="theme-toggle" title="Toggle dark / light mode">
        <span id="theme-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8.5 2a5.5 5.5 0 1 0 4.38 8.83A7 7 0 0 1 5.17 3.12 5.5 5.5 0 0 0 8.5 2z"/></svg></span>
      </button>
    </div>
  </nav>

  <div class="app-layout">
    <main class="content-area">

      <!-- Action toolbar -->
      <div class="compare-toolbar toolbar">
        <button class="btn btn-outline" onclick="swapSides()" title="Swap left and right lists (Alt+S)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 6l3-3M4 6l3 3M12 10H2m10 0l-3-3m3 3l-3 3"/></svg> Swap <span class="shortcut-hint">Alt+S</span>
        </button>
        <button class="btn btn-outline" onclick="moveAllRightToLeft()" title="Move all items from right to left (Alt+M)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 8H2m0 0l4-4M2 8l4 4"/></svg> Move All &rarr; Left <span class="shortcut-hint">Alt+M</span>
        </button>
        <button class="btn btn-outline" onclick="flagDuplicates()" title="Flag likely duplicate items (Alt+D)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1L1 14h14L8 1zm-.75 5h1.5v4h-1.5V6zm0 5h1.5v1.5h-1.5V11z"/></svg> Flag Duplicates <span class="shortcut-hint">Alt+D</span>
        </button>
      </div>

      <!-- Two-pane grid -->
      <div class="compare-grid">

        <!-- Left pane -->
        <section class="compare-pane">
          <div class="compare-pane-header">
            <div class="compare-pane-title" id="left-title">No list selected</div>
            <div class="compare-pane-pickers">
              <select id="left-subject-select" class="select-input"></select>
              <select id="left-item-select" class="select-input"></select>
            </div>
          </div>
          <div class="compare-table-wrap" id="left-table-wrap">
            <table class="compare-table">
              <tbody id="left-table"></tbody>
            </table>
            <div class="compare-empty" id="left-empty" style="display:none">No items</div>
          </div>
        </section>

        <!-- Right pane -->
        <section class="compare-pane">
          <div class="compare-pane-header">
            <div class="compare-pane-title" id="right-title">No list selected</div>
            <div class="compare-pane-pickers">
              <select id="right-subject-select" class="select-input"></select>
              <select id="right-item-select" class="select-input"></select>
            </div>
          </div>
          <div class="compare-table-wrap" id="right-table-wrap">
            <table class="compare-table">
              <tbody id="right-table"></tbody>
            </table>
            <div class="compare-empty" id="right-empty" style="display:none">No items</div>
          </div>
        </section>

      </div>
    </main>
  </div>

</body>
</html>
