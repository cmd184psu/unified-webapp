<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>uTuber</title>
  <script>
    try { const t = localStorage.getItem('ui-theme:utuber'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="/shared/dist/shared.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="6" width="24" height="16" rx="3" stroke="currentColor" stroke-width="2"/>
        <path d="M11 10.5l7 3.5-7 3.5V10.5z" fill="currentColor"/>
      </svg>
    </div>
    <div class="topbar-title">u<span>Tuber</span></div>
    <div class="topbar-spacer"></div>
    <button class="icon-btn" id="settings-btn" aria-label="Settings"
            aria-expanded="false" aria-controls="settings-panel">☰</button>
  </div>

  <div class="settings-panel" id="settings-panel" hidden>
    <div class="field">
      <label for="python-bin">Python interpreter</label>
      <input id="python-bin" placeholder="python3.12"
             autocomplete="off" spellcheck="false">
      <span class="optional-hint">Used by "Update yt-dlp". Blank resets to the server default.</span>
    </div>
    <div class="submit-row">
      <button class="btn btn-ghost btn-sm" id="settings-save">Save</button>
      <span id="settings-status" style="font-size:0.75rem;color:var(--color-text-faint)"></span>
    </div>
  </div>

  <!-- ── Submit card ── -->
  <div class="card" id="submit-card">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="video">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="16" height="12" rx="2"/>
          <path d="M8 8l5 2.5L8 13V8z" fill="currentColor" stroke="none"/>
        </svg>
        Video
      </button>
      <button class="mode-tab" data-mode="audio">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4h2v12H9zM5 7h2v6H5zM13 6h2v8h-2z"/>
        </svg>
        Audio (MP3)
      </button>
    </div>

    <div id="dup-banner" class="dup-banner"></div>
    <div id="err-toast" class="err-toast"></div>

    <form id="enqueue-form">
      <input type="hidden" name="mode" id="mode-input" value="video">
      <div class="form-body">
        <div class="field">
          <label>YouTube URL</label>
          <input name="url" placeholder="https://www.youtube.com/watch?v=…" required>
        </div>
        <div class="field">
          <label>Show / Artist <span class="optional-hint">(auto-filled if blank)</span></label>
          <input name="show" placeholder="Leave blank to use YouTube uploader">
        </div>
        <div class="form-row">
          <div class="field">
            <label>Episode / Track Title <span class="optional-hint">(auto-filled if blank)</span></label>
            <input name="title" placeholder="Leave blank to use YouTube title">
          </div>
          <div class="field">
            <label>Season</label>
            <input name="season" type="number" placeholder="1" value="1" required>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Episode</label>
            <input name="episode" type="number" placeholder="1" value="1" required>
          </div>
          <div class="field" style="justify-content:flex-end">
            <label>&nbsp;</label>
            <div class="submit-row">
              <button type="submit" class="btn btn-video" id="submit-btn">Add to Queue</button>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- ── Tools card ── -->
  <div class="card">
    <div class="update-panel">
      <button class="btn btn-ghost btn-sm" id="update-btn">Update yt-dlp</button>
      <span id="update-status" style="font-size:0.75rem;color:var(--color-text-faint)"></span>
      <div id="update-log" class="update-log"></div>
    </div>
  </div>

  <!-- ── Jobs card ── -->
  <div class="card" id="jobs-card">
    <div class="jobs-header">
      <h2>Queue</h2>
      <span class="jobs-count" id="jobs-count"></span>
    </div>
    <div id="jobs-list" class="jobs-list">
      <div class="empty-state">No jobs yet — add one above.</div>
    </div>
  </div>

  <script type="module" src="js/bundle.js"></script>
</body>
</html>
