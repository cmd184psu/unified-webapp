<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>uTuber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --font: 'Inter', system-ui, sans-serif;
      --bg:          #0f1117;
      --surface:     #1a1d27;
      --surface-2:   #22263a;
      --border:      #2e3248;
      --text:        #e8eaf0;
      --text-muted:  #7b8099;
      --text-faint:  #454a63;
      --primary:     #6c63ff;
      --primary-hov: #5a52e0;
      --primary-dim: rgba(108,99,255,0.15);
      --audio:       #f59e0b;
      --audio-hov:   #d97706;
      --audio-dim:   rgba(245,158,11,0.15);
      --success:     #22c55e;
      --danger:      #ef4444;
      --dl-blue:     #3b82f6;
      --conv-orange: #f59e0b;
      --radius:      0.6rem;
      --radius-sm:   0.35rem;
      --shadow:      0 4px 24px rgba(0,0,0,0.45);
      --t:           160ms cubic-bezier(0.16,1,0.3,1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-font-smoothing: antialiased; }
    body {
      font-family: var(--font);
      font-size: 0.9rem;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem 4rem;
    }

    /* ── Topbar ── */
    .topbar {
      width: 100%;
      max-width: 680px;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2.5rem;
    }
    .topbar-logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--primary);
    }
    .topbar-logo svg { width: 28px; height: 28px; }
    .topbar-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .topbar-title span { color: var(--primary); }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card + .card { margin-top: 1.25rem; }

    /* ── Mode tabs ── */
    .mode-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
    }
    .mode-tab {
      flex: 1;
      padding: 0.85rem 1rem;
      font: inherit;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      border: none;
      background: none;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: color var(--t), background var(--t);
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .mode-tab:hover { color: var(--text); background: var(--surface-2); }
    .mode-tab.active[data-mode="video"] {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--primary-dim);
    }
    .mode-tab.active[data-mode="audio"] {
      color: var(--audio);
      border-bottom-color: var(--audio);
      background: var(--audio-dim);
    }

    /* ── Form ── */
    .form-body {
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.3rem; }
    .field label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .field input {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.55rem 0.75rem;
      color: var(--text);
      font: inherit;
      font-size: 0.875rem;
      transition: border-color var(--t), box-shadow var(--t);
      width: 100%;
    }
    .field input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-dim);
    }
    .field input::placeholder { color: var(--text-faint); }

    .submit-row { display: flex; justify-content: flex-end; }
    .btn {
      padding: 0.6rem 1.4rem;
      font: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: background var(--t), transform var(--t);
    }
    .btn:active { transform: scale(0.97); }
    .btn-video { background: var(--primary); color: #fff; }
    .btn-video:hover { background: var(--primary-hov); }
    .btn-audio { background: var(--audio); color: #0f1117; }
    .btn-audio:hover { background: var(--audio-hov); }

    /* ── Jobs section ── */
    .jobs-header {
      padding: 1rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .jobs-header h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .jobs-count {
      font-size: 0.75rem;
      color: var(--text-faint);
    }

    .jobs-list { padding: 0.5rem 0; }

    .job-item {
      padding: 0.9rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 1rem;
      border-bottom: 1px solid var(--border);
      transition: background var(--t);
    }
    .job-item:last-child { border-bottom: none; }
    .job-item:hover { background: var(--surface-2); }

    .job-meta { min-width: 0; }
    .job-name {
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .job-sub {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .mode-badge {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
    }
    .mode-badge.video { background: var(--primary-dim); color: var(--primary); }
    .mode-badge.audio { background: var(--audio-dim); color: var(--audio); }

    .job-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.4rem;
      min-width: 160px;
    }

    .status-pill {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.18rem 0.55rem;
      border-radius: 999px;
    }
    .status-queued   { background: rgba(123,128,153,0.2); color: var(--text-muted); }
    .status-running  { background: rgba(59,130,246,0.2);  color: var(--dl-blue); }
    .status-completed{ background: rgba(34,197,94,0.2);   color: var(--success); }
    .status-failed   { background: rgba(239,68,68,0.2);   color: var(--danger); }

    .progress-wrap {
      width: 160px;
      height: 5px;
      background: var(--surface-2);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }
    .progress-bar.dl    { background: var(--dl-blue); }
    .progress-bar.conv  { background: var(--conv-orange); }
    .progress-bar.done  { background: var(--success); }

    .progress-label {
      font-size: 0.7rem;
      color: var(--text-faint);
    }

    .download-link {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--primary);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .download-link:hover { color: var(--primary-hov); }
    .download-link.audio-dl { color: var(--audio); }
    .download-link.audio-dl:hover { color: var(--audio-hov); }

    .dl-actions {
      display: flex;
      gap: 0.6rem;
    }

    .job-error {
      font-size: 0.72rem;
      color: var(--danger);
      margin-top: 0.25rem;
      word-break: break-all;
      max-width: 340px;
    }

    .err-toast {
      display: none;
      margin: 0.75rem 1.5rem 0;
      padding: 0.7rem 1rem;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.4);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      color: var(--danger);
      line-height: 1.5;
    }

    .optional-hint {
      font-weight: 400;
      font-size: 0.7rem;
      color: var(--text-faint);
      text-transform: none;
      letter-spacing: 0;
    }

    .update-panel {
      border-top: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }
    .update-log {
      display: none;
      width: 100%;
      margin-top: 0.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.75rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .btn-sm {
      padding: 0.35rem 0.85rem;
      font-size: 0.75rem;
    }
    .btn-ghost {
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: var(--border); color: var(--text); }

    .empty-state {
      padding: 2.5rem 1.5rem;
      text-align: center;
      color: var(--text-faint);
      font-size: 0.85rem;
    }

    .dup-banner {
      display: none;
      margin: 0 1.5rem 0;
      padding: 0.75rem 1rem;
      background: rgba(245,158,11,0.12);
      border: 1px solid rgba(245,158,11,0.4);
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      color: var(--audio);
      line-height: 1.5;
    }
    .dup-banner strong { font-weight: 600; }
    .dup-banner a { color: inherit; text-decoration: underline; }
    .dup-banner .dup-actions {
      margin-top: 0.5rem;
      display: flex;
      gap: 0.5rem;
    }
    .dup-btn {
      font: inherit;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.3rem 0.7rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      border: 1px solid currentColor;
      background: none;
      color: var(--audio);
      transition: background var(--t);
    }
    .dup-btn:hover { background: rgba(245,158,11,0.15); }
    .dup-btn.dismiss { color: var(--text-muted); border-color: var(--border); }
    .dup-btn.dismiss:hover { background: var(--surface-2); }

    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
      .job-right { min-width: 100px; }
      .progress-wrap { width: 100px; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-logo">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="6" width="24" height="16" rx="3" stroke="currentColor" stroke-width="2"/>
        <path d="M11 10.5l7 3.5-7 3.5V10.5z" fill="currentColor"/>
      </svg>
    </div>
    <div class="topbar-title">u<span>Tuber</span></div>
  </div>

  <!-- ── Submit card ── -->
  <div class="card" id="submit-card">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="video" onclick="setMode('video')">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="4" width="16" height="12" rx="2"/>
          <path d="M8 8l5 2.5L8 13V8z" fill="currentColor" stroke="none"/>
        </svg>
        Video
      </button>
      <button class="mode-tab" data-mode="audio" onclick="setMode('audio')">
        <svg width="15" height="15" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4h2v12H9zM5 7h2v6H5zM13 6h2v8h-2z"/>
        </svg>
        Audio (MP3)
      </button>
    </div>

    <div id="dup-banner" class="dup-banner"></div>
    <div id="err-toast" class="err-toast"></div>

    <form id="enqueue-form">
      <input type="hidden" name="mode" id="mode-input" value="video">
      <div class="form-body">
        <div class="field">
          <label>YouTube URL</label>
          <input name="url" placeholder="https://www.youtube.com/watch?v=…" required>
        </div>
        <div class="field">
          <label>Show / Artist <span class="optional-hint">(auto-filled if blank)</span></label>
          <input name="show" placeholder="Leave blank to use YouTube uploader">
        </div>
        <div class="form-row">
          <div class="field">
            <label>Episode / Track Title <span class="optional-hint">(auto-filled if blank)</span></label>
            <input name="title" placeholder="Leave blank to use YouTube title">
          </div>
          <div class="field">
            <label>Season</label>
            <input name="season" type="number" placeholder="1" value="1" required>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Episode</label>
            <input name="episode" type="number" placeholder="1" value="1" required>
          </div>
          <div class="field" style="justify-content:flex-end">
            <label>&nbsp;</label>
            <div class="submit-row">
              <button type="submit" class="btn btn-video" id="submit-btn">Add to Queue</button>
            </div>
          </div>
        </div>
      </div>
    </form>
  </div>

  <!-- ── Tools card ── -->
  <div class="card">
    <div class="update-panel">
      <button class="btn btn-ghost btn-sm" onclick="runYtdlpUpdate()" id="update-btn">Update yt-dlp</button>
      <span id="update-status" style="font-size:0.75rem;color:var(--text-faint)"></span>
      <div id="update-log" class="update-log"></div>
    </div>
  </div>

  <!-- ── Jobs card ── -->
  <div class="card" id="jobs-card">
    <div class="jobs-header">
      <h2>Queue</h2>
      <span class="jobs-count" id="jobs-count"></span>
    </div>
    <div id="jobs-list" class="jobs-list">
      <div class="empty-state">No jobs yet — add one above.</div>
    </div>
  </div>

<script>
let currentMode = 'video'
let pendingFormData = null

function setMode(mode) {
  currentMode = mode
  document.getElementById('mode-input').value = mode

  document.querySelectorAll('.mode-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.mode === mode)
  })

  const btn = document.getElementById('submit-btn')
  btn.className = mode === 'audio' ? 'btn btn-audio' : 'btn btn-video'
}

function hideDupBanner() {
  const b = document.getElementById('dup-banner')
  b.style.display = 'none'
  b.innerHTML = ''
  pendingFormData = null
}

function showDupBanner(data, formData) {
  pendingFormData = formData
  const b = document.getElementById('dup-banner')
  const fname = data.output_file || '(unknown)'
  b.innerHTML = `
    <div>
      <strong>Already downloaded.</strong>
      "${esc(data.show_name)}" was previously saved as
      <a href="/downloads/${encodeURIComponent(fname)}">${esc(fname)}</a>.
    </div>
    <div class="dup-actions">
      <button class="dup-btn" onclick="forceEnqueue()">Download again anyway</button>
      <button class="dup-btn dismiss" onclick="hideDupBanner()">Dismiss</button>
    </div>`
  b.style.display = 'block'
}

async function forceEnqueue() {
  if (!pendingFormData) return
  pendingFormData.set('force', '1')
  await submitForm(pendingFormData)
  hideDupBanner()
}

function showErrToast(msg) {
  const t = document.getElementById('err-toast')
  t.textContent = msg
  t.style.display = 'block'
}
function hideErrToast() {
  const t = document.getElementById('err-toast')
  t.style.display = 'none'
  t.textContent = ''
}

async function submitForm(formData) {
  hideErrToast()
  let res
  try {
    res = await fetch('/enqueue', { method: 'POST', body: formData })
  } catch (err) {
    showErrToast('Could not reach server: ' + err.message)
    return
  }
  if (res.status === 409) {
    const data = await res.json()
    showDupBanner(data, formData)
    return
  }
  if (res.status === 204) {
    document.querySelector('input[name="url"]').value = ''
    hideDupBanner()
    refreshJobs()
    return
  }
  const body = await res.text().catch(() => '')
  showErrToast(`Server error ${res.status}${body ? ': ' + body.trim() : ''}`)
}

document.getElementById('enqueue-form').addEventListener('submit', async e => {
  e.preventDefault()
  hideDupBanner()
  await submitForm(new FormData(e.target))
})

async function refreshJobs() {
  const res = await fetch('/jobs.json')
  const jobs = await res.json()

  const list = document.getElementById('jobs-list')
  const countEl = document.getElementById('jobs-count')

  if (!jobs || jobs.length === 0) {
    list.innerHTML = '<div class="empty-state">No jobs yet — add one above.</div>'
    countEl.textContent = ''
    return
  }

  countEl.textContent = jobs.length + (jobs.length === 1 ? ' job' : ' jobs')

  list.innerHTML = jobs.map(j => jobRow(j)).join('')
}

function jobRow(j) {
  const epLabel = `S${String(j.Season).padStart(2,'0')}E${String(j.Episode).padStart(2,'0')}`
  const mode = j.Mode || 'video'
  const { barClass, pct, label } = parseProgress(j.Progress, j.Status)
  const statusClass = 'status-' + (j.Status || 'queued')
  const isAudio = mode === 'audio'

  const dlLink = j.Status === 'completed'
    ? `<div class="dl-actions">
        <a class="download-link ${isAudio ? 'audio-dl' : ''}" href="/downloads/${encodeURIComponent(j.OutputFile)}" target="_blank" rel="noopener">
          <svg width="12" height="12" viewBox="0 0 20 20" fill="currentColor">
            <path d="M6 4l10 6-10 6V4z"/>
          </svg>
          Play
        </a>
        <a class="download-link ${isAudio ? 'audio-dl' : ''}" href="/downloads/${encodeURIComponent(j.OutputFile)}" download>
          <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 3v10M5 13l5 5 5-5"/><line x1="3" y1="19" x2="17" y2="19"/>
          </svg>
          Download
        </a>
      </div>`
    : ''

  const errLine = j.Error
    ? `<div class="job-error" title="${esc(j.Error)}">⚠ ${esc(j.Error)}</div>`
    : ''

  return `
    <div class="job-item">
      <div class="job-meta">
        <div class="job-name">${esc(j.ShowName)} — ${esc(j.EpisodeTitle)}</div>
        <div class="job-sub">
          <span>${epLabel}</span>
          <span class="mode-badge ${mode}">${mode}</span>
        </div>
        ${errLine}
      </div>
      <div class="job-right">
        <span class="status-pill ${statusClass}">${j.Status}</span>
        ${barClass ? `
        <div class="progress-wrap">
          <div class="progress-bar ${barClass}" style="width:${pct}%"></div>
        </div>
        <span class="progress-label">${label}</span>
        ` : ''}
        ${dlLink}
      </div>
    </div>`
}

function parseProgress(p, status) {
  if (status === 'completed') return { barClass: 'done', pct: 100, label: '' }
  if (!p) return { barClass: '', pct: 0, label: '' }

  if (p.startsWith('download')) {
    const pct = parseFloat(p.split(' ')[1]) || 0
    return { barClass: 'dl', pct, label: `Downloading ${pct.toFixed(0)}%` }
  }
  if (p.startsWith('convert') || p === 'converting') {
    const pct = parseFloat(p.split(' ')[1]) || 0
    return { barClass: 'conv', pct: pct || 50, label: 'Converting…' }
  }
  if (p === 'done') return { barClass: 'done', pct: 100, label: '' }

  return { barClass: '', pct: 0, label: p }
}

function esc(s) {
  return String(s || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
}

function runYtdlpUpdate() {
  const btn = document.getElementById('update-btn')
  const status = document.getElementById('update-status')
  const log = document.getElementById('update-log')

  btn.disabled = true
  btn.textContent = 'Updating…'
  status.textContent = ''
  log.textContent = ''
  log.style.display = 'block'

  const es = new EventSource('/ytdlp-update')
  es.onmessage = e => {
    if (e.data === '__done__') {
      es.close()
      btn.disabled = false
      btn.textContent = 'Update yt-dlp'
      status.textContent = 'Done.'
      return
    }
    if (e.data.startsWith('ERROR:')) {
      log.textContent += e.data + '\n'
      es.close()
      btn.disabled = false
      btn.textContent = 'Update yt-dlp'
      status.style.color = 'var(--danger)'
      status.textContent = 'Update failed.'
      return
    }
    log.textContent += e.data + '\n'
    log.scrollTop = log.scrollHeight
  }
  es.onerror = () => {
    es.close()
    btn.disabled = false
    btn.textContent = 'Update yt-dlp'
    status.style.color = 'var(--danger)'
    status.textContent = 'Connection error.'
  }
}

setInterval(refreshJobs, 2000)
refreshJobs()
</script>
</body>
</html>
