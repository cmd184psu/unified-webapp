<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Slideshow</title>
  <script>
    try { const t = localStorage.getItem('ui-theme:slideshow'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <link rel="stylesheet" href="/shared/dist/shared.css" />
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="display">
    <!-- Image layer -->
    <img id="slide-img" alt="">

    <!-- Overlay: the top bar plus the two floating control cards -->
    <div id="overlay">

      <!-- Top bar: subject label + image counter + debug readout + hamburger -->
      <div id="top-bar">
        <div id="top-left">
          <span id="subject-label"></span>
          <span id="image-counter"></span>
        </div>
        <span id="debug-display" hidden></span>
        <button id="btn-hamburger" aria-label="Settings">&#9776;</button>
      </div>

      <!-- Control cards: translucent overlays, snapped to one of 8 positions
           (set in the ☰ menu) or dragged anywhere by their grip, and
           minimizable down to just the grip and icon (click the icon to
           expand). Layout is shared server state. -->
      <div id="card-visual" class="ctrl-card" data-card="visual" data-pos="bottom">
        <div class="card-head">
          <span class="card-grip" title="Drag to move"><svg viewBox="0 0 14 14" fill="currentColor" width="12" height="12" aria-hidden="true"><circle cx="4" cy="3" r="1.2"/><circle cx="10" cy="3" r="1.2"/><circle cx="4" cy="7" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="4" cy="11" r="1.2"/><circle cx="10" cy="11" r="1.2"/></svg></span>
          <button type="button" class="card-icon" title="Image controls (click to minimize or expand)" aria-label="Minimize or expand image controls"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="9.5" cy="9" r="1.8"/><path d="M20 16l-4.5-4.5L7 20"/></svg></button>
          <span class="card-title">Images</span>
          <button type="button" class="card-min" title="Minimize" aria-label="Minimize image controls">&#8211;</button>
        </div>
        <div class="card-body">
          <button id="btn-prev-subject" title="Previous subject">&#9198;</button>
          <button id="btn-prev" title="Previous image">&#8249;</button>
          <button id="btn-play-pause" title="Play / Pause">&#9646;&#9646;</button>
          <button id="btn-next" title="Next image">&#8250;</button>
          <button id="btn-next-subject" title="Next subject">&#9197;</button>
        </div>
      </div>

      <!-- Audio card: hidden until music collections are available -->
      <div id="card-audio" class="ctrl-card" data-card="audio" data-pos="bottom-right" hidden>
        <div class="card-head">
          <span class="card-grip" title="Drag to move"><svg viewBox="0 0 14 14" fill="currentColor" width="12" height="12" aria-hidden="true"><circle cx="4" cy="3" r="1.2"/><circle cx="10" cy="3" r="1.2"/><circle cx="4" cy="7" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="4" cy="11" r="1.2"/><circle cx="10" cy="11" r="1.2"/></svg></span>
          <button type="button" class="card-icon" title="Audio controls (click to minimize or expand)" aria-label="Minimize or expand audio controls"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></button>
          <span id="music-label" class="card-title">Audio</span>
          <button type="button" class="card-min" title="Minimize" aria-label="Minimize audio controls">&#8211;</button>
        </div>
        <div class="card-body">
          <button id="btn-music-stop" title="Stop audio">&#9632;</button>
          <button id="btn-music-play" title="Play audio">&#9654;</button>
          <button id="btn-music-next" title="Next collection">&gt;&gt;</button>
        </div>
      </div>

    </div><!-- /overlay -->

  </div><!-- /display -->

  <audio id="audio-player" preload="auto"></audio>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
